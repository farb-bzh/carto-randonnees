<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mes randonnées sur le GR34</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="style.css">
<script src="commun.js"></script>
<script src="chiffrement.js"></script>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <h1><span class="mark" aria-hidden="true"></span>Mes randonnées sur le GR34</h1>
      <p class="totals" id="totals">Carte verrouillée</p>
    </header>
    <p class="msg" id="msg" role="status"></p>
    <ul id="list"></ul>
  </aside>
  <div class="mapwrap">
    <div id="map"></div>
    <div class="banner" id="banner">Le fond de carte ne se charge pas ici. Les traces restent affichées.</div>
  </div>
</div>

<div class="lock pw" id="lock">
  <form id="lockform">
    <h2>Carte protégée</h2>
    <p>Saisissez le mot de passe qui vous a été communiqué pour afficher les randonnées.</p>
    <label>Mot de passe
      <input type="password" id="pw" autocomplete="current-password" required>
    </label>
    <p class="msg err" id="lockerr" role="alert"></p>
    <div class="actions">
      <button class="btn primary" type="submit" id="lockok">Afficher la carte</button>
    </div>
  </form>
</div>

<script>
const DATA_URL='data/randonnees.enc.json', SESSION_KEY='carto-randonnees-mdp';
const map = creerCarte();
const hikes = new Map(), layers = new Map();
let selected = null, envelope = null;

function say(t, err){ const m=$('msg'); m.textContent=t; m.className='msg'+(err?' err':''); }
function session(action, value){
  try{
    if(action==='get') return sessionStorage.getItem(SESSION_KEY);
    if(action==='set') sessionStorage.setItem(SESSION_KEY, value);
    if(action==='del') sessionStorage.removeItem(SESSION_KEY);
  }catch(e){}
  return null;
}

function render(){
  const list=$('list'); list.innerHTML='';
  const arr=[...hikes.values()].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const total=arr.reduce((s,h)=>s+h.km,0);
  $('totals').textContent = arr.length ? `${arr.length} randonnée${arr.length>1?'s':''}, ${fmtKm(total)} km` : 'Aucune randonnée publiée';
  for(const h of arr){
    const li=document.createElement('li'); if(h.id===selected) li.className='sel';
    li.innerHTML=`<button class="go"><span class="n">${esc(h.name)}</span><span class="d">${fmtDate(h.date)} – ${fmtKm(h.km)} km</span></button>`;
    li.querySelector('.go').onclick=()=>select(h.id,true);
    list.appendChild(li);
  }
}

function select(id, zoom){
  selected=id;
  for(const [k,g] of layers){ const c=g.getLayers()[1]; c.setStyle({weight:k===id?5.5:3.5}); if(k===id) g.eachLayer(l=>l.bringToFront()); }
  if(zoom) map.fitBounds(L.polyline(hikes.get(id).pts).getBounds(),{padding:[30,30]});
  render();
}

function showLock(err){ $('lock').hidden=false; $('lockerr').textContent=err||''; $('pw').focus(); }

// Déchiffre et affiche ; renvoie false si le mot de passe est faux
async function unlock(password){
  let gj;
  try{ gj=await Chiffrement.decrypt(envelope, password); }
  catch(e){ if(e.code==='BAD_PASSWORD') return false; throw e; }
  for(const h of depuisGeoJSON(gj, 'Données publiées')){ hikes.set(h.id,h); layers.set(h.id, dessinerTrace(map, h, id=>select(id,false))); }
  $('lock').hidden=true;
  render(); cadrer(map,[...hikes.values()]);
  return true;
}

$('lockform').addEventListener('submit', async e=>{
  e.preventDefault();
  const pw=$('pw').value;
  $('lockok').disabled=true; $('lockerr').textContent='Déchiffrement…';
  try{
    if(await unlock(pw)){ session('set', pw); $('pw').value=''; }
    else showLock('Mot de passe incorrect.');
  }catch(err){ console.error(err); showLock('Impossible de lire les données : '+err.message); }
  finally{ $('lockok').disabled=false; }
});

(async function init(){
  try{
    const r=await fetch(DATA_URL);
    if(r.status===404){ $('lock').hidden=true; $('totals').textContent='Aucune randonnée publiée pour l’instant'; return; }
    if(!r.ok) throw new Error('HTTP '+r.status);
    envelope=await r.json();
  }catch(e){ console.error(e); $('lock').hidden=true; say('Impossible de charger les données : '+e.message, true); return; }
  const saved=session('get');
  if(saved){
    try{ if(await unlock(saved)) return; }catch(e){ console.error(e); }
    session('del');
  }
  showLock();
})();
</script>
</body>
</html>
